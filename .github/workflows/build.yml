name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Maven test selector (e.g. -pl gson -Dtest=JsonReaderTest)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -DfailIfNoTests=false ${{ inputs.test-filter }}
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: List skipped tests with reasons
        if: always()
        run: |
          echo "Skipped tests (from target/surefire-reports/*.xml):"
          echo "  Note: JsonReaderPathTest.multipleTopLevelValuesInOneDocument calls assumeTrue(factory == Factory.STRING_READER); it is skipped by design for the OBJECT_READER (JsonTreeReader) parameter, which cannot hold multiple top-level values."
          for f in $(find . -path '*/target/surefire-reports/TEST-*.xml'); do
            grep -B1 '<skipped' "$f" | grep -o '<testcase [^>]*>\|<skipped[^>]*>' | sed "s|^|  $(basename "$f"): |"
          done
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-2.9.0.jar
          if-no-files-found: error
